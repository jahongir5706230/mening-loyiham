
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mening saytim</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px 15px;
  margin: 0;
}

h1 {
  font-size: 36px;
}

p {
  font-size: 18px;
}

button {
  background: #ffcc00;
  color: #333;
  padding: 13px 22px;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 7px;
  transition: 0.3s;
}

button:hover {
  background: white;
  transform: scale(1.04);
}

.tanlov {
  margin: 25px auto;
}

.bolim {
  display: none;
}

.faol {
  display: block;
}

.kurs, .ob-havo {
  background: white;
  color: #333;
  max-width: 380px;
  margin: 15px auto;
  padding: 20px;
  border-radius: 18px;
  font-size: 18px;
  box-shadow: 0 5px 15px #33333330;
}

.viloyatlar {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 850px;
  margin: 20px auto;
  gap: 5px;
}

.viloyatlar button {
  font-size: 14px;
  padding: 12px 16px;
}

.harorat {
  font-size: 45px;
  font-weight: bold;
  color: #667eea;
}

input {
  padding: 13px;
  border-radius: 25px;
  border: none;
  font-size: 16px;
  max-width: 90%;
  margin: 10px;
}

hr {
  border: 1px solid #ffffff50;
  margin: 25px 0;
}

small {
  color: #666;
}
</style>
</head>

<body>

<h1>Salom, do'stlar! 👋</h1>

<p>
Mening saytimga xush kelibsiz!
Bu yerda valyuta kurslari va ob-havoni kuzatishingiz mumkin.
</p>

<button onclick="alert('Salom! Saytimizga xush kelibsiz 🎉')">
Tugmani bos!
</button>

<h2>Kerakli bo'limni tanlang 👇</h2>

<div class="tanlov">

<button onclick="bolimniOch('valyuta')">
💰 VALYUTA
</button>

<button onclick="bolimniOch('ob-havo')">
🌤️ OB-HAVO
</button>

</div>

<!-- VALYUTA -->

<div id="valyuta" class="bolim">

<h2>💰 Bugungi valyuta kurslari</h2>

<div id="kurslar">
Ma'lumot yuklanmoqda...
</div>

<button onclick="kurslarniOl()">
🔄 Kurslarni yangilash
</button>

</div>

<!-- OB-HAVO -->

<div id="ob-havo" class="bolim">

<h2>🌤️ O'zbekiston ob-havosi</h2>

<p>Kerakli viloyatni tanlang:</p>

<div class="viloyatlar">

<button onclick="viloyatTanla('Tashkent')">Toshkent viloyati</button>

<button onclick="viloyatTanla('Samarkand')">Samarqand</button>

<button onclick="viloyatTanla('Bukhara')">Buxoro</button>

<button onclick="viloyatTanla('Andijan')">Andijon</button>

<button onclick="viloyatTanla('Namangan')">Namangan</button>

<button onclick="viloyatTanla('Fergana')">Farg'ona</button>

<button onclick="viloyatTanla('Nukus')">Qoraqalpog'iston</button>

<button onclick="viloyatTanla('Jizzakh')">Jizzax</button>

<button onclick="viloyatTanla('Gulistan')">Sirdaryo</button>

<button onclick="viloyatTanla('Karshi')">Qashqadaryo</button>

<button onclick="viloyatTanla('Termez')">Surxondaryo</button>

<button onclick="viloyatTanla('Navoi')">Navoiy</button>

<button onclick="viloyatTanla('Urgench')">Xorazm</button>

<button onclick="viloyatTanla('Tashkent City')">Toshkent shahri</button>

</div>

<div id="obHavo" class="ob-havo">
Viloyatni tanlang 👆
</div>

<button onclick="obHavoniYangila()">
🔄 Ob-havoni yangilash
</button>

</div>

<script>

// BO'LIMLARNI ALMASHTIRISH

function bolimniOch(nom) {

  document.querySelectorAll(".bolim").forEach(b => {
    b.classList.remove("faol");
  });

  document.getElementById(nom).classList.add("faol");

  if (nom === "valyuta") {
    kurslarniOl();
  }

}

// VALYUTA KURSLARI

async function kurslarniOl() {

  const joy = document.getElementById("kurslar");

  joy.innerHTML = "Ma'lumot yuklanmoqda...";

  try {

    const javob = await fetch(
      "https://cbu.uz/uz/arkhiv-kursov-valyut/json/"
    );

    if (!javob.ok) throw new Error("Xatolik");

    const malumot = await javob.json();

    const kerakli = ["USD", "EUR", "RUB"];

    joy.innerHTML = "";

    malumot
      .filter(v => kerakli.includes(v.Ccy))
      .forEach(v => {

        const karta = document.createElement("div");

        karta.className = "kurs";

        karta.textContent =
          v.Ccy + " — " +
          Number(v.Rate).toLocaleString("uz-UZ") +
          " so'm";

        joy.appendChild(karta);

      });

  } catch (xato) {

    joy.innerHTML =
      "Valyuta kurslarini olishda xatolik yuz berdi!";

  }

}

// TANLANGAN VILOYAT

let tanlanganShahar = "";

function viloyatTanla(shahar) {

  tanlanganShahar = shahar;

  obHavoniOl();

}

// OB-HAVONI YANGILASH

function obHavoniYangila() {

  if (tanlanganShahar) {
    obHavoniOl();
  } else {
    document.getElementById("obHavo").innerHTML =
      "Avval viloyatni tanlang!";
  }

}

// OB-HAVO MA'LUMOTLARI

async function obHavoniOl() {

  const joy = document.getElementById("obHavo");

  joy.innerHTML = "🌍 Ob-havo yuklanmoqda...";

  try {

    const geoUrl =
      "https://geocoding-api.open-meteo.com/v1/search?name=" +
      encodeURIComponent(tanlanganShahar) +
      "&count=1&language=uz&format=json";

    const geoJavob = await fetch(geoUrl);

    if (!geoJavob.ok) throw new Error("Shahar topilmadi");

    const geo = await geoJavob.json();

    if (!geo.results || geo.results.length === 0) {
      throw new Error("Shahar topilmadi");
    }

    const shahar = geo.results[0];

    const url =
      `https://api.open-meteo.com/v1/forecast?latitude=${shahar.latitude}&longitude=${shahar.longitude}` +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m" +
      "&timezone=auto";

    const javob = await fetch(url);

    if (!javob.ok) throw new Error("Ob-havo olinmadi");

    const data = await javob.json();

    const h = data.current;

    const holatlar = {

      0: "☀️ Ochiq havo",
      1: "🌤️ Asosan ochiq",
      2: "⛅ Qisman bulutli",
      3: "☁️ Bulutli",
      45: "🌫️ Tuman",
      48: "🌫️ Qirovli tuman",
      51: "🌦️ Mayda yomg'ir",
      53: "🌦️ Yomg'ir",
      55: "🌧️ Kuchli yomg'ir",
      61: "🌧️ Yengil yomg'ir",
      63: "🌧️ Yomg'ir",
      65: "⛈️ Kuchli yomg'ir",
      71: "🌨️ Yengil qor",
      73: "❄️ Qor",
      75: "❄️ Kuchli qor",
      80: "🌦️ Jala",
      81: "🌧️ Kuchli jala",
      82: "⛈️ Kuchli jala",
      95: "⛈️ Momaqaldiroq",
      96: "⛈️ Do'l",
      99: "⛈️ Kuchli do'l"

    };

    const holat =
      holatlar[h.weather_code] || "🌤️ Ob-havo";

    joy.innerHTML = `

      <h3>📍 ${shahar.name}, ${shahar.country || ""}</h3>

      <div class="harorat">
        ${Math.round(h.temperature_2m)}°C
      </div>

      <h3>${holat}</h3>

      <p>🌡️ His qilinadi: ${h.apparent_temperature}°C</p>

      <p>💧 Namlik: ${h.relative_humidity_2m}%</p>

      <p>💨 Shamol: ${h.wind_speed_10m} km/soat</p>

      <small>🕒 ${h.time.replace("T", " ")}</small>

    `;

  } catch (xato) {

    joy.innerHTML =
      "❌ Ma'lumot olinmadi. Qayta urinib ko'ring!";

  }

}

</script>

</body>
</html>
