
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mening saytim</title>

  <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 20px;
    }

    h1 { font-size: 36px; }

    p { font-size: 20px; }

    button {
      background: #ffcc00;
      color: #333;
      padding: 14px 30px;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin: 10px;
    }

    .kurs {
      background: white;
      color: #333;
      max-width: 350px;
      margin: 12px auto;
      padding: 15px;
      border-radius: 15px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <h1>Salom, do'stlar! 👋</h1>

  <img src="https://placehold.co/500x300/667eea/ffffff?text=TECHNOLOGY"
       alt="Technology" width="350">

  <p>Men GitHub orqali sayt yaratishni o'rganyapman.</p>

  <button onclick="alert('Salom! Qalaysan! 🎉')">
    Tugmani bos!
  </button>

  <h2>💰 Bugungi valyuta kurslari</h2>

  <div id="kurslar">
    Ma'lumot yuklanmoqda...
  </div>

  <button onclick="kurslarniOl()">
    🔄 Kurslarni yangilash
  </button>

  <script>
    async function kurslarniOl() {
      const joy = document.getElementById("kurslar");
      joy.innerHTML = "Ma'lumot yuklanmoqda...";

      try {
        const javob = await fetch(
          "https://cbu.uz/uz/arkhiv-kursov-valyut/json/"
        );

        if (!javob.ok) {
          throw new Error("Ma'lumot olinmadi");
        }

        const malumot = await javob.json();

        const kerakli = ["USD", "EUR", "RUB"];

        joy.innerHTML = "";

        malumot
          .filter(valyuta => kerakli.includes(valyuta.Ccy))
          .forEach(valyuta => {
            const karta = document.createElement("div");
            karta.className = "kurs";

            karta.textContent =
              valyuta.Ccy + " — " +
              Number(valyuta.Rate).toLocaleString("uz-UZ") +
              " so'm";

            joy.appendChild(karta);
          });

      } catch (xato) {
        joy.innerHTML =
          "Ma'lumot olishda xatolik yuz berdi. Qayta urinib ko'ring.";
      }
    }

    kurslarniOl();
  </script>

</body>
</html>
